# Tag-triggered release: attach the prebuilt tarball to the tag.
#
# Installing the package straight from the source tree makes pnpm run `prepare`
# (the repository ignores `lib/`, so there is nothing to import until it does),
# and pnpm >= 10 refuses dependency build scripts until the profile's
# `pnpm-workspace.yaml` lists the exact commit under `allowBuilds`. The tarball
# built here already contains `lib/`, so installing it needs no approval at all:
#   pnpm add https://github.com/<owner>/<repo>/releases/download/v0.2.25/dsh-mobile-plugin-0.2.25.tgz
#
# Both names are attached — `dsh-mobile-plugin-<version>.tgz` and the
# version-free `dsh-mobile-plugin.tgz` — because the plugin's update button
# rewrites the tag in an asset URL and keeps the file name (see
# `releaseAssetSpec` in src/update.ts).
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Publish prebuilt tarball
    runs-on: ubuntu-latest
    env:
      PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # tests/integration.spec.ts spawns a real nats-server child process.
      - name: Install NATS server
        run: |
          set -euo pipefail
          version=2.14.6
          work="$RUNNER_TEMP/nats-server"
          mkdir -p "$work"
          curl -fsSL "https://github.com/nats-io/nats-server/releases/download/v${version}/nats-server-v${version}-linux-amd64.tar.gz" | tar -xz -C "$work" --strip-components=1
          sudo install -m 0755 "$work/nats-server" /usr/local/bin
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Publishing an artifact is the one place a mismatch must stop the run:
      # the tag names the version users install, `package.json` names the
      # tarball, and `src/bridge.ts` is what a running plugin reports.
      - name: Check the tag, package.json and PLUGIN_VERSION agree
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$version" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi
          if ! grep -q "PLUGIN_VERSION = '${version}'" src/bridge.ts; then
            echo "src/bridge.ts does not report PLUGIN_VERSION '${version}'" >&2
            exit 1
          fi
      - name: Typecheck host half
        run: pnpm run typecheck
      - name: Typecheck client half
        run: pnpm run typecheck:client
      - name: Test
        run: pnpm test
      - name: Build and pack
        run: |
          set -euo pipefail
          pnpm run build
          pnpm pack
          version="$(node -p 'require("./package.json").version')"
          # npm would strip the scope from a tarball name, pnpm keeps it
          # (`@scope/name` → `scope-name-<version>.tgz`). The assets keep the
          # historical scope-free name on purpose: installed profiles pin that
          # name inside their update URL (`releaseAssetSpec` in src/update.ts
          # rewrites the version in it, not the shape of it).
          scoped="$(node -p 'const n = require("./package.json").name; n[0] === "@" ? n.slice(1).replace("/", "-") : n')"
          mv "${scoped}-${version}.tgz" "dsh-mobile-plugin-${version}.tgz"
          # The version-free alias is what a "always newest" URL points at.
          cp "dsh-mobile-plugin-${version}.tgz" dsh-mobile-plugin.tgz
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          assets=("dsh-mobile-plugin-${version}.tgz" "dsh-mobile-plugin.tgz")
          # A tag suffix means a pre-release, and `releases/latest` must keep
          # pointing at a stable one: it is a documented install URL.
          prerelease=''
          case "${GITHUB_REF_NAME}" in *-*) prerelease='--prerelease' ;; esac
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" \
            --generate-notes ${prerelease} "${assets[@]}" \
            || gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber
      # Optional on purpose: without the token this step says so and the run
      # still publishes the tarball assets. A version already on the registry is
      # left alone, so a re-run — or a release published by hand from the same
      # tag — does not fail here. It runs last so a rejection (a token that
      # still wants 2FA, a scope it may not write) cannot cost the release its
      # assets; the failure then shows up as a red step with the output above.
      - name: Publish to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          if [ -z "${NPM_TOKEN}" ]; then
            echo "没有配置 NPM_TOKEN，跳过 npm 发布（GitHub Release 资产照常发布）。"
            exit 0
          fi
          if npm view "@dsh-earhartzhao/dsh-mobile-plugin@${version}" version >/dev/null 2>&1; then
            echo "npm 上已经有 ${version}，跳过。"
            exit 0
          fi
          # `prepare` runs here, at publish time, not at install time: the
          # published tarball ships `lib/`, which is why installing from the
          # registry needs no allowBuilds approval.
          if out="$(npm publish --access public --//registry.npmjs.org/:_authToken="${NPM_TOKEN}" 2>&1)"; then
            echo "${out}"
            exit 0
          fi
          echo "${out}"
          # A brand-new package's metadata document can answer 404 for a few
          # minutes behind the registry cache even though the version is
          # published (the tarball is already served), so "this version already
          # exists" is a skip too, not a red run.
          case "${out}" in
            *"cannot publish over the previously published versions"*|*EPUBLISHCONFLICT*)
              echo "npm 上已经有 ${version}（提交冲突），跳过。"
              exit 0
              ;;
          esac
          exit 1
